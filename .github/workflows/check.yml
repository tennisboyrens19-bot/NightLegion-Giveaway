name: Giveaway checks

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - run: python -m py_compile bot.py runelite_bridge.py giveaway/cog.py
      - run: python -m compileall -q giveaway cogs
